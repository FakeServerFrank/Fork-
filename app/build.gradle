plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fork.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fork.assistant'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}